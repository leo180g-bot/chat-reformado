  <script type="application/ld+json">

    "inLanguage": "es"

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }

    :root {
      --bg-body: #0b1120;
      --bg-panel: #131d31;
      --bg-subpanel: #090d16;
      --border-color: #24324d;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-btn: #0284c7;
      --accent-btn-hover: #0369a1;
      --accent-gold: #facc15;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-body);
      color: var(--text-main);
      margin: 0;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      width: 100vw;
      overflow-x: hidden;
    }

    /* Versículo Superior (Web) */
    .top-verse-banner {
      width: 100%;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border-color);
      padding: 10px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }

    .verse-content-box {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      overflow: hidden;
    }

    .verse-badge {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .verse-quote {
      margin: 0;
      font-size: 0.85rem;
      font-style: italic;
      color: #cbd5e1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .verse-reference {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--accent-gold);
      white-space: nowrap;
    }

    .btn-refresh-verse {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 4px;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .btn-refresh-verse:hover {
      background: var(--border-color);
      color: var(--accent);
    }

    /* BARRA DE MENÚ MÓVIL SUPERIOR (Visible sólo en móviles) */
    .mobile-top-bar {
      display: none;
      width: 100%;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border-color);
      padding: 8px 12px;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      position: sticky;
      top: 0;
      z-index: 50;
      overflow-x: auto;
    }

    .mobile-nav-title {
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    .mobile-links-container {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mobile-quick-btn {
      background: var(--bg-subpanel);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 5px 9px;
      border-radius: 6px;
      font-size: 0.74rem;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .mobile-quick-btn:hover, .mobile-quick-btn:active {
      background: var(--accent-btn);
      color: #fff;
      border-color: var(--accent);
    }

    /* Contenedor Principal Panorámico (Web) */
    .app-viewport-wrapper {
      flex: 1;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px 32px;
      gap: 40px;
      align-items: center;
    }

    /* Columna Izquierda: Banner y Recursos */
    .showcase-column {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .brand-banner-container {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      line-height: 0;
      background: var(--bg-subpanel);
    }

    .app-main-banner {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }

    .resources-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .resource-card {
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      transition: transform 0.2s, border-color 0.2s;
    }
    .resource-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }

    .chapel-logo {
      max-width: 130px;
      width: 100%;
      height: auto;
      border-radius: 4px;
    }

    .resource-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: var(--accent);
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 600;
      width: 100%;
      padding: 7px 10px;
      border-radius: 6px;
      background: var(--bg-subpanel);
      border: 1px solid var(--border-color);
      transition: all 0.15s;
    }
    .resource-btn:hover {
      background: var(--accent-btn);
      color: #fff;
      border-color: var(--accent);
    }

    .resource-desc {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 6px;
      line-height: 1.3;
    }

    /* Columna Derecha: Tarjeta de Acceso */
    .auth-column {
      display: flex;
      justify-content: center;
    }

    .auth-card {
      width: 100%;
      max-width: 440px;
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 26px 22px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.5);
    }

    .auth-header {
      margin-bottom: 20px;
      text-align: center;
    }
    .auth-header h1 {
      margin: 0;
      font-size: 1.5rem;
      color: var(--accent);
    }
    .auth-header p {
      margin: 4px 0 0;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .auth-tabs {
      display: flex;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 18px;
    }

    .auth-tab {
      flex: 1;
      background: none;
      border: none;
      color: var(--text-muted);
      padding: 10px 4px;
      font-weight: 700;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      font-size: 0.88rem;
      transition: color 0.15s, border-color 0.15s;
    }
    .auth-tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .auth-field {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 14px;
      text-align: left;
    }

    .auth-field label {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .auth-field input, .auth-field select {
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: var(--bg-subpanel);
      color: var(--text-main);
      font-size: 0.92rem;
      outline: none;
      transition: border-color 0.15s;
    }
    .auth-field input:focus, .auth-field select:focus {
      border-color: var(--accent);
    }

    .btn-primary {
      width: 100%;
      padding: 11px;
      background: var(--accent-btn);
      border: none;
      border-radius: 6px;
      color: white;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 6px;
    }
    .btn-primary:hover {
      background: var(--accent-btn-hover);
    }

    .footer-bar {
      width: 100%;
      padding: 12px 20px;
      text-align: center;
      font-size: 0.78rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border-color);
      background: rgba(11, 17, 32, 0.9);
      flex-shrink: 0;
    }

    /* VERSIÓN MÓVIL */
    @media (max-width: 860px) {
      body {
        padding: 0;
        justify-content: flex-start;
      }

      .mobile-top-bar {
        display: flex;
      }

      .top-verse-banner {
        padding: 6px 12px;
        background: rgba(15, 23, 42, 0.95);
      }
      .verse-quote {
        display: none;
      }
      .verse-reference {
        font-size: 0.72rem;
      }

      .app-viewport-wrapper {
        display: flex;
        flex-direction: column;
        padding: 10px 14px 20px;
        gap: 12px;
        max-width: 100%;
      }

      .showcase-column {
        width: 100%;
        gap: 8px;
      }

      .brand-banner-container {
        border-radius: 8px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
      }

      .resources-row {
        display: none;
      }

      .auth-column {
        width: 100%;
      }

      .auth-card {
        padding: 14px 10px;
        border-radius: 8px;
        background: transparent;
        border: none;
        box-shadow: none;
      }

      .auth-header {
        display: none;
      }

      .auth-field {
        margin-bottom: 10px;
      }
      .auth-field input, .auth-field select {
        padding: 11px 12px;
      }

      .footer-bar {
        padding: 8px 12px;
        font-size: 0.72rem;
      }
    }
  </style>
</head>

          </a>
          <span class="resource-desc">Texto sagrado RVR1960 en línea</span>

        <!-- Tarjeta 3: Chapel Library -->
        <div class="resource-card">
          <a href="https://www.chapellibrary.org/" target="_blank" rel="noopener noreferrer" style="line-height: 0;" title="Visitar Chapel Library">
