<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Comunión Doctrinal - Bienvenida</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background-color: #1e2638;
      background: radial-gradient(circle at center, #25334d 0%, #111827 100%);
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .welcome-container {
      max-width: 440px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    /* Contenedor del logo interactivo */
    .logo-wrapper {
      position: relative;
      width: 100%;
      max-width: 380px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
      border: 1px solid #334155;
    }

    .logo-img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Zona clicable superpuesta exactamente en el botón 'ENTRAR AL CHAT' */
    .btn-hotspot {
      position: absolute;
      bottom: 12%;
      left: 28%;
      width: 44%;
      height: 7.5%;
      display: block;
      cursor: pointer;
      border-radius: 6px;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
    }

    .btn-hotspot:hover {
      background: rgba(255, 255, 255, 0.12);
      box-shadow: 0 0 16px rgba(234, 179, 8, 0.4);
      transform: scale(1.02);
    }

    /* Botón accesible inferior adicional */
    .btn-enter-fallback {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 28px;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      font-size: 1rem;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(2, 132, 199, 0.35);
      transition: transform 0.15s, box-shadow 0.2s;
      width: 100%;
      max-width: 320px;
    }

    .btn-enter-fallback:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(2, 132, 199, 0.5);
    }

    .motto {
      font-size: 0.85rem;
      color: #94a3b8;
      font-style: italic;
      margin: 0;
    }
  </style>
</head>
<body>

  <div class="welcome-container">
    <div class="logo-wrapper">
      <img src="logo.png" alt="Comunión Doctrinal - Teología Reformada" class="logo-img">
      <!-- Clic directamente sobre el botón gráfico -->
      <a href="chat.html" class="btn-hotspot" title="Entrar al chat"></a>
    </div>

    <!-- Botón directo de acceso -->
    <a href="chat.html" class="btn-enter-fallback">
      <span>Entrar a la Sala General</span>
      <span>➤</span>
    </a>

    <p class="motto">Soli Deo Gloria</p>
  </div>

</body>
</html>
