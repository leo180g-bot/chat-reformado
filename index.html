  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }

    :root {
      --bg-body: #0f172a;
      --bg-panel: #1e293b;
      --bg-subpanel: #111827;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-btn: #0284c7;
      --accent-btn-hover: #0369a1;
      --accent-gold: #facc15;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-body);
      color: var(--text-main);
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 0 16px 30px;
    }

    /* Banner Superior de Versículo Aleatorio */
    .top-verse-banner {
      width: 100%;
      max-width: 680px;
      margin: 16px 0 12px 0;
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.95), rgba(15, 23, 42, 0.9));
      border: 1px solid var(--border-color);
      border-left: 4px solid var(--accent);
      border-radius: 8px;
      padding: 12px 16px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.35);
      position: relative;
    }

    .verse-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .verse-badge {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .btn-refresh-verse {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.78rem;
      padding: 2px 7px;
      border-radius: 4px;
      transition: all 0.2s ease;
    }

    .btn-refresh-verse:hover {
      background: var(--bg-subpanel);
      color: var(--accent);
      border-color: var(--accent);
    }

    .verse-quote {
      margin: 0;
      font-size: 0.88rem;
      font-style: italic;
      color: #e2e8f0;
      line-height: 1.45;
    }

    .verse-reference {
      margin: 4px 0 0 0;
      text-align: right;
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--accent-gold);
    }

    /* Contenedor Principal */
    .main-card {
      width: 100%;
      max-width: 460px;
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 22px 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 18px;
    }

    .brand-header h1 {
      margin: 0;
      font-size: 1.55rem;
      color: var(--accent);
      letter-spacing: -0.02em;
    }

    .brand-header p {
      margin: 6px 0 0;
      font-size: 0.84rem;
      color: var(--text-muted);
    }

    /* Banner Chapel Library */
    .chapel-banner-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg-subpanel);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 18px;
      text-align: center;
    }

    .chapel-link {
      display: inline-block;
      transition: transform 0.2s ease, opacity 0.2s ease;
      line-height: 0;
    }

    .chapel-link:hover {
      transform: scale(1.03);
      opacity: 0.95;
    }

    .chapel-logo {
      max-width: 190px;
      width: 100%;
      height: auto;
      object-fit: contain;
      border-radius: 4px;
    }

    .chapel-caption {
      margin: 8px 0 0 0;
      font-size: 0.74rem;
      color: var(--text-muted);
      line-height: 1.35;
    }

    /* Pestañas de Acceso */
    .auth-tabs {
      display: flex;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 16px;
    }

    .auth-tab {
      flex: 1;
      background: none;
      border: none;
      color: var(--text-muted);
      padding: 9px 4px;
      font-weight: 700;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      font-size: 0.85rem;
      transition: color 0.15s, border-color 0.15s;
    }

    .auth-tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .auth-field {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 12px;
      text-align: left;
    }

    .auth-field label {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .auth-field input, .auth-field select {
      padding: 9px 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: var(--bg-subpanel);
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.15s;
    }

    .auth-field input:focus, .auth-field select:focus {
      border-color: var(--accent);
    }

    .btn-primary {
      width: 100%;
      padding: 10px;
      background: var(--accent-btn);
      border: none;
      border-radius: 6px;
      color: white;
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 6px;
    }

    .btn-primary:hover {
      background: var(--accent-btn-hover);
    }

    /* Tarjeta inferior para Lector Bíblico */
    .bible-reader-link-card {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .bible-cover-link {
      display: block;
      width: 100%;
      max-width: 320px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
      transition: transform 0.2s ease, border-color 0.2s ease;
      line-height: 0;
    }

    .bible-cover-link:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }

    .bible-cover-img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      display: block;
    }

    .bible-reader-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 12px;
      background: var(--bg-subpanel);
      color: var(--accent);
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
      width: 100%;
      max-width: 320px;
    }

    .bible-reader-btn:hover {
      background: var(--accent-btn);
      color: #fff;
      border-color: var(--accent);
    }

    .footer-note {
      text-align: center;
      margin-top: 18px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    .footer-note span {
      color: var(--accent);
      font-style: italic;
    }
  </style>
</head>
<body>

  <!-- Banner Superior: Versículo Bíblico Aleatorio -->
  <section class="top-verse-banner" aria-label="Versículo del día">
    <div class="verse-header-row">
      <span class="verse-badge">📖 Palabra de Gracia</span>
      <button type="button" class="btn-refresh-verse" id="btnNextVerse" title="Cargar otro pasaje">🔄 Cambiar</button>
    </div>
    <p class="verse-quote" id="verseText">Cargando pasaje...</p>
    <div class="verse-reference" id="verseRef">—</div>
  </section>

  <!-- Tarjeta Central de Ingreso -->
  <main class="main-card">
    <header class="brand-header">
      <h1>Comunión Doctrinal</h1>
      <p>Plataforma de diálogo teológico y edificación reformada</p>
    </header>

    <!-- Enlace a Biblioteca Externa con logo_chapel.png -->
    <div class="chapel-banner-container">
      <a href="https://www.chapellibrary.org/" target="_blank" rel="noopener noreferrer" class="chapel-link" title="Visitar Chapel Library">
        <img src="logo_chapel.png" alt="Chapel Library" class="chapel-logo" onerror="this.style.display='none'; document.getElementById('chapelFallbackText').style.display='block';">
      </a>
      <span id="chapelFallbackText" style="display:none; font-weight:bold; color:var(--accent); font-size:0.85rem; margin-bottom:4px;">Chapel Library ↗</span>
      <p class="chapel-caption">Explora tratados, libros y literatura confesional en PDF sin costo.</p>
    </div>

    <!-- Pestañas de Acceso -->
    <div class="auth-tabs">
      <button type="button" class="auth-tab active" id="tabLogin">Iniciar Sesión</button>
      <button type="button" class="auth-tab" id="tabRegister">Registrarse</button>
      <button type="button" class="auth-tab" id="tabGuest">Invitado</button>
    </div>

    <!-- Formulario 1: Iniciar Sesión -->
    <form id="loginForm">
      <div class="auth-field">
        <label for="loginNick">Nick o usuario:</label>
        <input type="text" id="loginNick" placeholder="Tu nick registrado" required autocomplete="username">
      </div>
      <div class="auth-field">
        <label for="loginPassword">Contraseña:</label>
        <input type="password" id="loginPassword" placeholder="Tu contraseña" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-primary" id="btnLoginSubmit">Entrar a la Sala</button>
    </form>

    <!-- Formulario 2: Registro de Nueva Cuenta -->
    <form id="registerForm" style="display: none;">
      <div class="auth-field">
        <label for="regUsername">Nick público deseado:</label>
        <input type="text" id="regUsername" placeholder="Ej. Calvino_1536" required maxlength="30">
      </div>
      <div class="auth-field">
        <label for="regEmail">Correo electrónico:</label>
        <input type="email" id="regEmail" placeholder="correo@ejemplo.com" required autocomplete="email">
      </div>
      <div class="auth-field">
        <label for="regPassword">Contraseña:</label>
        <input type="password" id="regPassword" placeholder="Mínimo 6 caracteres" required minlength="6" autocomplete="new-password">
      </div>
      <div class="auth-field">
        <label for="regPasswordConfirm">Confirmar contraseña:</label>
        <input type="password" id="regPasswordConfirm" placeholder="Repite la contraseña" required minlength="6" autocomplete="new-password">
      </div>
      <button type="submit" class="btn-primary" id="btnRegisterSubmit">Crear Cuenta (Novicio)</button>
    </form>

    <!-- Formulario 3: Ingreso como Invitado -->
    <form id="guestForm" style="display: none;">
      <div class="auth-field">
        <label for="guestNick">Alias para esta sesión:</label>
        <input type="text" id="guestNick" placeholder="Ej. Oyente_Berea" required maxlength="25">
      </div>
      <div class="auth-field">
        <label for="guestDoctrine">Postura o trasfondo doctrinal:</label>
        <select id="guestDoctrine">
          <option value="Reformada">Reformado(a)</option>
          <option value="Presbiteriano">Presbiteriano(a)</option>
          <option value="Bautista Reformado">Bautista Reformado(a)</option>
          <option value="Bautista General">Bautista General</option>
          <option value="Metodista / Trad. Wesleyana">Metodista / Trad. Wesleyana</option>
          <option value="Pentecostal">Pentecostal</option>
          <option value="Otro trasfondo">Otro trasfondo</option>
        </select>
      </div>
      <button type="submit" class="btn-primary">Acceder como Invitado</button>
    </form>

    <!-- Enlace Inferior al Lector Bíblico con biblia.jpeg -->
    <section class="bible-reader-link-card" aria-label="Lector bíblico">
      <a href="biblia.html" class="bible-cover-link" title="Abrir Lector de la Biblia RVR1960">
        <img src="biblia.jpeg" alt="Santa Biblia Reina-Valera 1960" class="bible-cover-img" onerror="this.src='biblia.jpg';">
      </a>
      <a href="biblia.html" class="bible-reader-btn" title="Leer la Biblia en línea">
        📖 Abrir Lector Bíblico RVR1960
      </a>
    </section>

    <div class="footer-note">
      Soli Deo Gloria &bull; <span>Comunión Doctrinal</span>
    </div>
  </main>

  <script>
    const SUPABASE_URL = "https://axggsuhdurllzisrzpam.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_POBDb2OUFVVFcldLXTNY2Q_lt0xMeax";
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const VERSES = [
      { text: "«Porque por gracia sois salvos por medio de la fe; y esto no de vosotros, pues es don de Dios; no por obras, para que nadie se gloríe.»", ref: "Efesios 2:8-9 (RVR1960)" },
      { text: "«Toda la Escritura es inspirada por Dios, y útil para enseñar, para redargüir, para corregir, para instruir en justicia.»", ref: "2 Timoteo 3:16 (RVR1960)" },
      { text: "«Porque de él, y por él, y para él, son todas las cosas. A él sea la gloria por los siglos. Amén.»", ref: "Romanos 11:36 (RVR1960)" },
      { text: "«Justificados, pues, por la fe, tenemos paz para con Dios por medio de nuestro Señor Jesucristo.»", ref: "Romanos 5:1 (RVR1960)" },
      { text: "«Porque hay un solo Dios, y un solo mediador entre Dios y los hombres, Jesucristo hombre.»", ref: "1 Timoteo 2:5 (RVR1960)" },
      { text: "«Escudriñad las Escrituras; porque a vosotros os parece que en ellas tenéis la vida eterna; y ellas son las que dan testimonio de mí.»", ref: "Juan 5:39 (RVR1960)" },
      { text: "«Sécase la hierba, marchítase la flor; mas la palabra del Dios nuestro permanece para siempre.»", ref: "Isaías 40:8 (RVR1960)" },
      { text: "«Porque ¿quién te distingue? ¿o qué tienes que no hayas recibido? Y si lo recibiste, ¿por qué te glorías como si no hubieras recibido?»", ref: "1 Corintios 4:7 (RVR1960)" },
      { text: "«Y estos eran más nobles que los que estaban en Tesalónica, pues recibieron la palabra con toda solicitud, escudriñando cada día las Escrituras para ver si estas cosas eran así.»", ref: "Hechos 17:11 (RVR1960)" },
      { text: "«A Jehová he puesto siempre delante de mí; porque está a mi diestra, no seré conmovido.»", ref: "Salmos 16:8 (RVR1960)" }
    ];

    const verseTextEl = document.getElementById('verseText');
    const verseRefEl = document.getElementById('verseRef');
    const btnNextVerse = document.getElementById('btnNextVerse');
    let lastVerseIndex = -1;

    function displayRandomVerse() {
      let index;
      do {
        index = Math.floor(Math.random() * VERSES.length);
      } while (index === lastVerseIndex && VERSES.length > 1);

      lastVerseIndex = index;
      const v = VERSES[index];
      verseTextEl.textContent = v.text;
      verseRefEl.textContent = v.ref;
    }

    displayRandomVerse();
    btnNextVerse.onclick = () => displayRandomVerse();

    async function checkExistingSession() {
      const savedGuest = localStorage.getItem('guest_user');
      if (savedGuest) {
        window.location.replace('chat.html');
        return;
      }
      const { data: { session } } = await client.auth.getSession();
      if (session) {
        window.location.replace('chat.html');
      }
    }
    checkExistingSession();

    const tabLogin = document.getElementById('tabLogin');
    const tabRegister = document.getElementById('tabRegister');
    const tabGuest = document.getElementById('tabGuest');
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const guestForm = document.getElementById('guestForm');

    function switchTab(activeBtn, activeForm) {
      [tabLogin, tabRegister, tabGuest].forEach(t => t.classList.remove('active'));
      [loginForm, registerForm, guestForm].forEach(f => f.style.display = 'none');
      activeBtn.classList.add('active');
      activeForm.style.display = 'block';
    }

    tabLogin.onclick = () => switchTab(tabLogin, loginForm);
    tabRegister.onclick = () => switchTab(tabRegister, registerForm);
    tabGuest.onclick = () => switchTab(tabGuest, guestForm);

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const nick = document.getElementById('loginNick').value.trim();
      const pass = document.getElementById('loginPassword').value;
      const submitBtn = document.getElementById('btnLoginSubmit');

      submitBtn.disabled = true;
      submitBtn.textContent = "Verificando...";

      try {
        const { data: userEmail, error: rpcError } = await client.rpc('get_user_email_by_nick', { target_nick: nick });
        if (rpcError || !userEmail) {
          throw new Error("El nick ingresado no existe. Revisa la ortografía o regístrate.");
        }

        const { error: authError } = await client.auth.signInWithPassword({ email: userEmail, password: pass });
        if (authError) {
          throw new Error("Contraseña incorrecta: " + authError.message);
        }

        localStorage.removeItem('guest_user');
        window.location.replace('chat.html');
      } catch (err) {
        alert(err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Entrar a la Sala";
      }
    });

    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('regUsername').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const pass = document.getElementById('regPassword').value;
      const passConfirm = document.getElementById('regPasswordConfirm').value;
      const submitBtn = document.getElementById('btnRegisterSubmit');

      if (pass !== passConfirm) {
        return alert("Las contraseñas no coinciden.");
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Creando cuenta...";

      try {
        const { error } = await client.auth.signUp({
          email: email,
          password: pass,
          options: { data: { username: username } }
        });

        if (error) throw error;

        localStorage.removeItem('guest_user');
        alert("¡Cuenta registrada con éxito! Ingresando como Novicio...");
        window.location.replace('chat.html');
      } catch (err) {
        alert("Error al registrar: " + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Crear Cuenta (Novicio)";
      }
    });

    guestForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const nick = document.getElementById('guestNick').value.trim();
      const doctrine = document.getElementById('guestDoctrine').value;
      if (!nick) return;

      localStorage.setItem('guest_user', JSON.stringify({
        username: nick,
        doctrine_affinity: doctrine,
        role: 'guest'
      }));

      window.location.replace('chat.html');
    });
  </script>
</body>
</html>
