<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Comunión Doctrinal - Chat Reformado</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; display: flex; flex-direction: column; height: 100vh; }
    header { background: #1e293b; padding: 14px 20px; border-bottom: 1px solid #334155; }
    h1 { margin: 0; font-size: 1.2rem; color: #38bdf8; }
    p.subtitle { margin: 4px 0 0; font-size: 0.85rem; color: #94a3b8; }
    #chat-box { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .msg { background: #1e293b; padding: 10px 14px; border-radius: 6px; max-width: 85%; border-left: 4px solid #64748b; }
    .msg.ref { border-left-color: #38bdf8; }
    .msg-meta { font-size: 0.8rem; color: #94a3b8; margin-bottom: 4px; }
    .msg-meta strong { color: #f1f5f9; }
    .msg-meta .badge { font-size: 0.75rem; background: #334155; padding: 2px 6px; border-radius: 4px; margin-left: 6px; }
    .msg-text { word-break: break-word; line-height: 1.4; }
    form { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px; background: #1e293b; border-top: 1px solid #334155; }
    input, select, button { padding: 10px 12px; border-radius: 4px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 0.95rem; }
    input:focus, select:focus { outline: none; border-color: #38bdf8; }
    button { background: #0284c7; border: none; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #0369a1; }
  </style>
</head>
<body>
  <header>
    <h1>Comunión Doctrinal</h1>
    <p class="subtitle">Eje central: Teología Reformada (Soli Deo Gloria) | Espacio abierto al diálogo fraterno</p>
  </header>

  <div id="chat-box"></div>

  <form id="chat-form">
    <input type="text" id="username" placeholder="Tu nombre / alias" required style="width: 160px;">
    <select id="doctrine">
      <option value="Reformada">Reformado(a)</option>
      <option value="Presbiteriano">Presbiteriano(a)</option>
      <option value="Bautista Reformado">Bautista Reformado(a)</option>
      <option value="Bautista General">Bautista General</option>
      <option value="Metodista / Arminiano">Metodista / Trad. Wesleyana</option>
      <option value="Pentecostal">Pentecostal</option>
      <option value="Otro trasfondo">Otro trasfondo</option>
    </select>
    <input type="text" id="content" placeholder="Escribe tu mensaje bíblico o teológico..." required style="flex: 1; min-width: 200px;">
    <button type="submit">Enviar</button>
  </form>

  <script>
    const SUPABASE_URL = "https://axggsuhdurllzisrzpam.supabase.co";
    // Sustituye el texto de abajo con la clave anon/public que copiaste de Project Settings > API:
    const SUPABASE_ANON_KEY = "sb_publishable_POBDb2OUFVVFcldLXTNY2Q_lt0xMeax";

    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const chatBox = document.getElementById('chat-box');
    const form = document.getElementById('chat-form');

    function appendMessage(data) {
      const div = document.createElement('div');
      const isRef = data.doctrine_affinity && data.doctrine_affinity.toLowerCase().includes('reformad');
      div.className = `msg ${isRef ? 'ref' : ''}`;
      div.innerHTML = `
        <div class="msg-meta">
          <strong>${escapeHtml(data.username)}</strong>
          <span class="badge">${escapeHtml(data.doctrine_affinity || 'General')}</span>
        </div>
        <div class="msg-text">${escapeHtml(data.content)}</div>
      `;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function escapeHtml(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    async function loadMessages() {
      const { data, error } = await client
        .from('messages')
        .select('*')
        .order('created_at', { ascending: true })
        .limit(60);

      if (data) {
        data.forEach(appendMessage);
      }
    }

    client.channel('chat-room')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
        appendMessage(payload.new);
      })
      .subscribe();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const userInput = document.getElementById('username');
      const doctrineInput = document.getElementById('doctrine');
      const contentInput = document.getElementById('content');

      const user = userInput.value.trim();
      const doctrine = doctrineInput.value;
      const content = contentInput.value.trim();

      if (!content || !user) return;

      contentInput.value = '';

      const { error } = await client.from('messages').insert([
        { username: user, doctrine_affinity: doctrine, content: content }
      ]);

      if (error) {
        alert("Error al enviar mensaje: " + error.message);
      }
    });

    loadMessages();
  </script>
</body>
</html>
