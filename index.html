<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Comunión Doctrinal - Chat Reformado</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; display: flex; flex-direction: column; height: 100vh; }
    
    header { background: #1e293b; padding: 12px 20px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    .header-text h1 { margin: 0; font-size: 1.2rem; color: #38bdf8; }
    .header-text p.subtitle { margin: 4px 0 0; font-size: 0.85rem; color: #94a3b8; }
    
    .btn-rules { background: #334155; border: 1px solid #475569; color: #f8fafc; padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; cursor: pointer; transition: background 0.2s; white-space: nowrap; }
    .btn-rules:hover { background: #475569; }

    #chat-box { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    
    .msg { background: #1e293b; padding: 10px 14px; border-radius: 6px; max-width: 85%; border-left: 4px solid #64748b; }
    .msg.ref { border-left-color: #38bdf8; }
    
    .msg-meta { font-size: 0.8rem; color: #94a3b8; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .msg-meta strong { color: #f1f5f9; }
    .msg-meta .badge { font-size: 0.75rem; background: #334155; padding: 2px 6px; border-radius: 4px; }
    .msg-meta .time { font-size: 0.72rem; color: #64748b; margin-left: auto; }
    
    .msg-text { word-break: break-word; line-height: 1.4; }
    
    form { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px; background: #1e293b; border-top: 1px solid #334155; }
    input, select, button { padding: 10px 12px; border-radius: 4px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 0.95rem; }
    input:focus, select:focus { outline: none; border-color: #38bdf8; }
    button[type="submit"] { background: #0284c7; border: none; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    button[type="submit"]:hover { background: #0369a1; }

    /* Estilos del Modal de Normas */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75); align-items: center; justify-content: center; z-index: 100; padding: 16px; }
    .modal-overlay.open { display: flex; }
    .modal-card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; max-width: 580px; width: 100%; max-height: 85vh; overflow-y: auto; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 10px; margin-bottom: 14px; }
    .modal-header h2 { margin: 0; font-size: 1.15rem; color: #38bdf8; }
    .close-btn { background: transparent; border: none; color: #94a3b8; font-size: 1.4rem; cursor: pointer; line-height: 1; }
    .modal-card p, .modal-card li { font-size: 0.88rem; color: #cbd5e1; line-height: 1.5; }
    .modal-card ul { padding-left: 18px; margin: 10px 0; }
  </style>
</head>
<body>
  <header>
    <div class="header-text">
      <h1>Comunión Doctrinal</h1>
      <p class="subtitle">Eje central: Teología Reformada (Soli Deo Gloria) | Espacio abierto al diálogo fraterno</p>
    </div>
    <button class="btn-rules" id="openRulesBtn">📜 Bases y Normas</button>
  </header>

  <div id="chat-box"></div>

  <form id="chat-form">
