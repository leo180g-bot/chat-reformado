<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sala General | Comunión Doctrinal</title>
  <meta name="description" content="Sala de chat en tiempo real para el diálogo cristiano reformado y estudio bíblico fraternal. Comunión Doctrinal.">
  <meta name="theme-color" content="#0f172a">

  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    :root {
      --bg-body: #0b1120;
      --bg-panel: #131d31;
      --bg-subpanel: #090d16;
      --border-color: #24324d;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-btn: #0284c7;
      --accent-btn-hover: #0369a1;
      --accent-gold: #facc15;
      --msg-self: #1e3a8a;
      --msg-other: #1e293b;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-body);
      color: var(--text-main);
      margin: 0;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Barra Superior */
    header.chat-header {
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border-color);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      z-index: 20;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-link {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--accent);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .user-pill {
      background: var(--bg-subpanel);
      border: 1px solid var(--border-color);
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      color: var(--accent-gold);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .header-nav {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-header {
      background: var(--bg-subpanel);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.78rem;
      cursor: pointer;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .btn-header:hover {
      background: var(--accent-btn);
      border-color: var(--accent);
      color: #fff;
    }

    .btn-logout {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }
    .btn-logout:hover {
      background: #dc2626;
      border-color: #dc2626;
      color: #fff;
    }

    /* Área Principal */
    .chat-layout {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 260px;
      overflow: hidden;
    }

    /* Panel de Mensajes */
    .chat-main {
      display: flex;
      flex-direction: column;
      height: 100%;
      border-right: 1px solid var(--border-color);
      overflow: hidden;
      background: var(--bg-body);
    }

    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message-item {
      max-width: 82%;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.9rem;
      line-height: 1.45;
      position: relative;
      word-break: break-word;
    }

    .message-item.self {
      align-self: flex-end;
      background: var(--msg-self);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-bottom-right-radius: 2px;
    }

    .message-item.other {
      align-self: flex-start;
      background: var(--msg-other);
      border: 1px solid var(--border-color);
      border-bottom-left-radius: 2px;
    }

    .msg-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 4px;
      font-size: 0.74rem;
    }

    .msg-sender {
      font-weight: 700;
      color: var(--accent);
    }

    .msg-role-tag {
      font-size: 0.68rem;
      padding: 1px 6px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.3);
      color: var(--text-muted);
    }

    .msg-time {
      color: var(--text-muted);
      font-size: 0.7rem;
    }

    .msg-body {
      color: var(--text-main);
    }

    /* Barra de Entrada */
    .chat-input-bar {
      padding: 12px 16px;
      background: var(--bg-panel);
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .chat-input-bar input[type="text"] {
      flex: 1;
      padding: 11px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--bg-subpanel);
      color: var(--text-main);
      font-size: 0.92rem;
      outline: none;
      transition: border-color 0.15s;
    }
    .chat-input-bar input[type="text"]:focus {
      border-color: var(--accent);
    }

    .btn-send {
      background: var(--accent-btn);
      border: none;
      color: #fff;
      padding: 11px 18px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-send:hover {
      background: var(--accent-btn-hover);
    }

    /* Barra Lateral de Usuarios Conectados */
    .online-sidebar {
      background: var(--bg-subpanel);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .user-list {
      list-style: none;
      margin: 0;
      padding: 10px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .online-user-item {
      padding: 6px 10px;
      border-radius: 6px;
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      font-size: 0.82rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .online-status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      display: inline-block;
      margin-right: 6px;
    }

    @media (max-width: 768px) {
      .chat-layout {
        grid-template-columns: 1fr;
      }
      .online-sidebar {
        display: none;
      }
    }
  </style>
</head>
<body>

  <!-- Barra Superior -->
  <header class="chat-header">
    <div class="brand-section">
      <a href="index.html" class="brand-link">✝️ Comunión Doctrinal</a>
      <div class="user-pill" id="userPill">
        <span>Conectando...</span>
      </div>
    </div>
    <nav class="header-nav">
      <a href="confesiones.html" class="btn-header" title="Confesiones de Fe">📜 Confesiones</a>
      <a href="biblia.html" target="_blank" rel="noopener noreferrer" class="btn-header" title="Abrir Lector Bíblico">📖 Biblia</a>
      <button type="button" class="btn-header btn-logout" id="btnLogout" title="Salir de la sesión">🚪 Salir</button>
    </nav>
  </header>

  <!-- Cuerpo del Chat -->
  <div class="chat-layout">
    <!-- Panel Central de Mensajes -->
    <main class="chat-main">
      <div class="messages-container" id="messagesContainer">
        <!-- Los mensajes en tiempo real se cargan aquí -->
      </div>

      <form class="chat-input-bar" id="chatForm">
        <input type="text" id="msgInput" placeholder="Escribe un mensaje bíblico o teológico..." autocomplete="off" required maxlength="1000">
        <button type="submit" class="btn-send">Enviar</button>
      </form>
    </main>

    <!-- Barra Lateral de Usuarios Activos -->
    <aside class="online-sidebar">
      <div class="sidebar-header">
        <span>En Línea</span>
        <span id="onlineCount" style="color:var(--accent);">0</span>
      </div>
      <ul class="user-list" id="onlineUserList">
        <!-- Lista de usuarios presentes -->
      </ul>
    </aside>
  </div>

  <script>
    const SUPABASE_URL = "https://axggsuhdurllzisrzpam.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_POBDb2OUFVVFcldLXTNY2Q_lt0xMeax";
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;
    let presenceChannel = null;

    // 1. INICIALIZACIÓN Y VALIDACIÓN ESTRICTA DE NICK
    async function initSession() {
      const guestRaw = localStorage.getItem('guest_user');

      // CASO A: Ingreso como Invitado
      if (guestRaw) {
        try {
          const guest = JSON.parse(guestRaw);

          // Comprobar si el nick del invitado está registrado oficialmente
          let isReg = false;
          const { data: isTaken, error: rpcErr } = await client.rpc('is_nick_registered', { target_nick: guest.username });
          
          if (!rpcErr && isTaken) {
            isReg = true;
          } else {
            // Fallback por si la RPC aún no está creada
            const { data: userEmail } = await client.rpc('get_user_email_by_nick', { target_nick: guest.username });
            if (userEmail) isReg = true;
          }

          if (isReg) {
            alert(`El alias "${guest.username}" pertenece a un miembro registrado. Debes iniciar sesión con tu contraseña.`);
            localStorage.removeItem('guest_user');
            window.location.replace('index.html');
            return;
          }

          currentUser = {
            id: 'guest_' + Math.random().toString(36).substring(2, 9),
            username: guest.username,
            role: 'guest',
            doctrine: guest.doctrine_affinity || 'Otro'
          };

        } catch (e) {
          localStorage.removeItem('guest_user');
          window.location.replace('index.html');
          return;
        }
      } 
      // CASO B: Usuario Registrado con Cuenta Oficial
      else {
        const { data: { session } } = await client.auth.getSession();
        if (!session) {
          window.location.replace('index.html');
          return;
        }

        // Obtener el perfil del usuario registrado
        const { data: profile } = await client
          .from('profiles')
          .select('username, role, doctrine_affinity')
          .eq('id', session.user.id)
          .single();

        currentUser = {
          id: session.user.id,
          username: profile ? profile.username : (session.user.user_metadata.username || 'Hermano'),
          role: profile ? profile.role : 'novice',
          doctrine: profile ? profile.doctrine_affinity : 'Reformada'
        };
      }

      // Actualizar interfaz con el usuario activo
      document.getElementById('userPill').innerHTML = `
        <span class="online-status-dot"></span>
        <strong>${currentUser.username}</strong>
        <span style="opacity:0.75; font-size:0.7rem;">(${currentUser.role === 'guest' ? 'Invitado' : currentUser.role})</span>
      `;

      // Inicializar Realtime Presence y Mensajería
      setupPresence();
      loadRecentMessages();
      subscribeToMessages();
    }

    // 2. CONTROL DE PRESENCIA Y PREVENCIÓN DE DUPLICADOS EN TIEMPO REAL
    function setupPresence() {
      const myNickLower = currentUser.username.trim().toLowerCase();

      presenceChannel = client.channel('room_presence', {
        config: {
          presence: { key: myNickLower }
        }
      });

      presenceChannel
        .on('presence', { event: 'sync' }, () => {
          const state = presenceChannel.presenceState();
          const userListEl = document.getElementById('onlineUserList');
          const countEl = document.getElementById('onlineCount');
          
          userListEl.innerHTML = '';
          const activeKeys = Object.keys(state);
          countEl.textContent = activeKeys.length;

          // VERIFICACIÓN DE DUPLICADO: Si hay más de un usuario con este mismo nick y somos invitados
          if (currentUser.role === 'guest') {
            const myPresenceEntries = state[myNickLower] || [];
            if (myPresenceEntries.length > 1) {
              // Si el ID de presencia más antiguo no es el nuestro, salimos
              const firstJoinedId = myPresenceEntries[0].user_id;
              if (firstJoinedId !== currentUser.id) {
                alert(`Ya hay un usuario conectado con el alias "${currentUser.username}". Elige otro nombre.`);
                localStorage.removeItem('guest_user');
                window.location.replace('index.html');
                return;
              }
            }
          }

          // Pintar lista de usuarios conectados
          activeKeys.forEach(k => {
            const entry = state[k][0];
            const li = document.createElement('li');
            li.className = 'online-user-item';
            li.innerHTML = `
              <span><span class="online-status-dot"></span>${entry.username}</span>
              <span class="msg-role-tag">${entry.role}</span>
            `;
            userListEl.appendChild(li);
          });
        })
        .subscribe(async (status) => {
          if (status === 'SUBSCRIBED') {
            await presenceChannel.track({
              user_id: currentUser.id,
              username: currentUser.username,
              role: currentUser.role,
              doctrine: currentUser.doctrine,
              online_at: new Date().toISOString()
            });
          }
        });
    }

    // 3. CARGA Y ENVÍO DE MENSAJES
    const messagesContainer = document.getElementById('messagesContainer');

    function appendMessage(msg) {
      const isSelf = msg.username === currentUser.username;
      const div = document.createElement('div');
      div.className = `message-item ${isSelf ? 'self' : 'other'}`;

      const timeStr = new Date(msg.created_at || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      div.innerHTML = `
        <div class="msg-header">
          <span class="msg-sender">${msg.username}</span>
          <span class="msg-time">${timeStr}</span>
        </div>
        <div class="msg-body">${escapeHTML(msg.content)}</div>
      `;
      messagesContainer.appendChild(div);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    async function loadRecentMessages() {
      const { data: messages, error } = await client
        .from('messages')
        .select('*')
        .order('created_at', { ascending: true })
        .limit(50);

      if (!error && messages) {
        messagesContainer.innerHTML = '';
        messages.forEach(m => appendMessage(m));
      }
    }

    function subscribeToMessages() {
      client
        .channel('public_chat_messages')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, (payload) => {
          appendMessage(payload.new);
        })
        .subscribe();
    }

    // Formulario de Envío
    document.getElementById('chatForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('msgInput');
      const text = input.value.trim();
      if (!text) return;

      input.value = '';

      const newMsg = {
        sender_id: currentUser.id,
        username: currentUser.username,
        role: currentUser.role,
        content: text,
        created_at: new Date().toISOString()
      };

      // Si la base de datos permite inserts de invitados o autenticados
      const { error } = await client.from('messages').insert([newMsg]);
      if (error) {
        // Fallback local visual por si las políticas RLS bloquean inserción directa
        appendMessage(newMsg);
      }
    });

    // 4. CERRAR SESIÓN
    document.getElementById('btnLogout').onclick = async () => {
      if (confirm('¿Deseas salir de la sala de chat?')) {
        if (presenceChannel) await presenceChannel.untrack();
        localStorage.removeItem('guest_user');
        await client.auth.signOut();
        window.location.replace('index.html');
      }
    };

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    // Iniciar
    initSession();
  </script>
</body>
</html>
