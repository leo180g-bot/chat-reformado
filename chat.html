<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sala General | Comunión Doctrinal</title>
  <meta name="description" content="Sala de chat en tiempo real para el diálogo cristiano reformado y estudio bíblico fraternal. Comunión Doctrinal.">
  <meta name="theme-color" content="#0f172a">

  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    :root {
      --bg-body: #0b1120;
      --bg-panel: #131d31;
      --bg-subpanel: #090d16;
      --border-color: #24324d;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-btn: #0284c7;
      --accent-btn-hover: #0369a1;
      --accent-gold: #facc15;
      --accent-ruby: #fb7185;
      --msg-self: #1e3a8a;
      --msg-other: #1e293b;
      --badge-admin: #ef4444;
      --badge-mod: #3b82f6;
      --badge-member: #10b981;
      --badge-novice: #94a3b8;
      --badge-guest: #64748b;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-body);
      color: var(--text-main);
      margin: 0;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Barra Superior */
    header.chat-header {
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border-color);
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      z-index: 30;
      gap: 8px;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-link {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--accent);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .user-pill {
      background: var(--bg-subpanel);
      border: 1px solid var(--border-color);
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      color: var(--accent-gold);
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
      max-width: 170px;
    }
    .user-pill:hover {
      border-color: var(--accent);
    }

    .header-nav {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn-header {
      background: var(--bg-subpanel);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.78rem;
      cursor: pointer;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      position: relative;
      white-space: nowrap;
    }
    .btn-header:hover {
      background: var(--accent-btn);
      border-color: var(--accent);
      color: #fff;
    }

    .btn-header .badge-count {
      position: absolute;
      top: -4px;
      right: -4px;
      background: #ef4444;
      color: #fff;
      font-size: 0.65rem;
      font-weight: bold;
      border-radius: 10px;
      padding: 1px 5px;
      min-width: 16px;
      text-align: center;
      display: none;
    }

    .btn-logout {
      background: rgba(239, 68, 68, 0.12);
      border-color: rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }
    .btn-logout:hover {
      background: #dc2626;
      border-color: #dc2626;
      color: #fff;
    }

    /* Menú Desplegable / Opciones Agrupadas */
    .menu-container {
      position: relative;
    }

    .dropdown-menu {
      display: none;
      position: absolute;
      right: 0;
      top: calc(100% + 6px);
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      min-width: 180px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
      z-index: 50;
      overflow: hidden;
      animation: fadeIn 0.15s ease;
    }
    .dropdown-menu.show {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .dropdown-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      font-size: 0.84rem;
      color: var(--text-main);
      text-decoration: none;
      background: transparent;
      border: none;
      width: 100%;
      text-align: left;
      cursor: pointer;
      transition: background 0.15s;
    }
    .dropdown-item:hover {
      background: var(--bg-subpanel);
      color: var(--accent);
    }
    .dropdown-item.danger {
      color: #fca5a5;
      border-top: 1px solid var(--border-color);
    }
    .dropdown-item.danger:hover {
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
    }

    /* Área Principal de Chat */
    .chat-layout {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 260px;
      overflow: hidden;
    }

    .chat-main {
      display: flex;
      flex-direction: column;
      height: 100%;
      border-right: 1px solid var(--border-color);
      overflow: hidden;
      background: var(--bg-body);
    }

    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message-item {
      max-width: 82%;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.9rem;
      line-height: 1.45;
      position: relative;
      word-break: break-word;
    }

    .message-item.self {
      align-self: flex-end;
      background: var(--msg-self);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-bottom-right-radius: 2px;
    }

    .message-item.other {
      align-self: flex-start;
      background: var(--msg-other);
      border: 1px solid var(--border-color);
      border-bottom-left-radius: 2px;
    }

    .msg-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
      font-size: 0.74rem;
    }

    .msg-sender {
      font-weight: 700;
      color: var(--accent);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      text-decoration: underline dotted;
    }
    .msg-sender:hover {
      color: var(--accent-gold);
    }

    .msg-role-tag {
      font-size: 0.65rem;
      padding: 1px 6px;
      border-radius: 10px;
      font-weight: 600;
      text-transform: capitalize;
    }
    .role-admin { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }
    .role-moderator { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.4); }
    .role-member { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); }
    .role-novice { background: rgba(148, 163, 184, 0.2); color: #cbd5e1; border: 1px solid rgba(148, 163, 184, 0.4); }
    .role-guest { background: rgba(100, 116, 139, 0.2); color: #94a3b8; border: 1px solid rgba(100, 116, 139, 0.4); }

    .msg-time {
      color: var(--text-muted);
      font-size: 0.7rem;
    }

    .msg-body {
      color: var(--text-main);
    }

    /* Barra de Entrada */
    .chat-input-bar {
      padding: 10px 14px;
      background: var(--bg-panel);
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .chat-input-bar input[type="text"] {
      flex: 1;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--bg-subpanel);
      color: var(--text-main);
      font-size: 0.92rem;
      outline: none;
      transition: border-color 0.15s;
    }
    .chat-input-bar input[type="text"]:focus {
      border-color: var(--accent);
    }

    .btn-send {
      background: var(--accent-btn);
      border: none;
      color: #fff;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-send:hover {
      background: var(--accent-btn-hover);
    }

    /* Barra Lateral de Usuarios Conectados */
    .online-sidebar {
      background: var(--bg-subpanel);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-left: 1px solid var(--border-color);
    }

    .sidebar-header {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .user-list {
      list-style: none;
      margin: 0;
      padding: 10px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .online-user-item {
      padding: 7px 10px;
      border-radius: 6px;
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      font-size: 0.82rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .online-user-item:hover {
      border-color: var(--accent);
    }

    .online-status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      display: inline-block;
      margin-right: 6px;
    }

    /* MODALES: Acciones de Usuario, Perfil, Privados, Online Móvil */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }
    .modal-overlay.open {
      display: flex;
    }

    .modal-card {
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      max-width: 440px;
      width: 100%;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6);
      overflow: hidden;
      animation: modalPop 0.18s ease;
    }

    @keyframes modalPop {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-subpanel);
    }

    .modal-title {
      margin: 0;
      font-size: 1rem;
      color: var(--accent);
      font-weight: 700;
    }

    .btn-close-modal {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
    }
    .btn-close-modal:hover { color: #fff; }

    .modal-body {
      padding: 16px;
      overflow-y: auto;
      font-size: 0.9rem;
    }

    /* Estilos Modal Acciones de Usuario */
    .user-profile-preview {
      text-align: center;
      margin-bottom: 16px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border-color);
    }
    .user-preview-avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--bg-subpanel);
      border: 2px solid var(--accent);
      margin: 0 auto 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
    }
    .user-preview-nick {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-main);
      margin: 0 0 4px;
    }
    .user-preview-badges {
      display: flex;
      gap: 6px;
      justify-content: center;
      align-items: center;
    }

    .action-btn-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn-action {
      width: 100%;
      padding: 9px 14px;
      border-radius: 6px;
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border-color);
      background: var(--bg-subpanel);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s;
    }
    .btn-action:hover {
      background: var(--accent-btn);
      border-color: var(--accent);
      color: #fff;
    }
    .btn-action.action-admin {
      background: rgba(239, 68, 68, 0.12);
      border-color: rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }
    .btn-action.action-admin:hover {
      background: #dc2626;
      color: #fff;
    }

    /* Modal de Privados */
    .privates-layout {
      display: flex;
      flex-direction: column;
      height: 420px;
    }
    .private-conv-header {
      padding: 8px 12px;
      background: var(--bg-subpanel);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--accent-gold);
    }
    .private-messages-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .private-input-row {
      display: flex;
      gap: 6px;
      padding: 10px;
      border-top: 1px solid var(--border-color);
      background: var(--bg-subpanel);
    }
    .private-input-row input {
      flex: 1;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: var(--bg-body);
      color: var(--text-main);
      outline: none;
    }

    /* ADAPTACIÓN MÓVIL SOLICITADA */
    @media (max-width: 768px) {
      .chat-layout {
        grid-template-columns: 1fr;
      }
      .online-sidebar {
        display: none;
      }

      /* En móvil se ocultan los botones sueltos de escritorio y se activa el menú agrupado */
      .desktop-only {
        display: none !important;
      }

      .mobile-only {
        display: inline-flex !important;
      }

      .chat-header {
        padding: 8px 10px;
      }
      .brand-link span {
        display: none; /* Dejar solo el icono para ahorrar espacio */
      }
    }

    @media (min-width: 769px) {
      .mobile-only {
        display: none !important;
      }
    }
  </style>
</head>
<body>

  <!-- Barra Superior -->
  <header class="chat-header">
    <div class="brand-section">
      <a href="index.html" class="brand-link" title="Inicio Comunión Doctrinal">
        ✝️ <span>Comunión Doctrinal</span>
      </a>
      <div class="user-pill" id="userPill" title="Ver / Editar mi perfil">
        <span class="online-status-dot"></span>
        <span id="userPillName">Conectando...</span>
      </div>
    </div>

    <!-- Navegación y Acciones -->
    <nav class="header-nav">
      <!-- 1. OPCIONES SIEMPRE VISIBLES POR FUERA EN MÓVIL Y ESCRITORIO -->
      <!-- Botón Usuarios en Línea -->
      <button type="button" class="btn-header" id="btnShowOnline" title="Usuarios Conectados">
        👥 <span class="desktop-only">En Línea</span> (<span id="onlineCountBadge">0</span>)
      </button>

      <!-- Botón Mensajes Privados -->
      <button type="button" class="btn-header" id="btnOpenPrivates" title="Mensajes Privados">
        💬 <span class="desktop-only">Privados</span>
        <span class="badge-count" id="privatesUnreadBadge">0</span>
      </button>

      <!-- 2. ENLACES DIRECTOS (VISIBLES SÓLO EN ESCRITORIO) -->
      <a href="confesiones.html" class="btn-header desktop-only" title="Confesiones de Fe">📜 Confesiones</a>
      <a href="biblia.html" target="_blank" rel="noopener noreferrer" class="btn-header desktop-only" title="Abrir Lector Bíblico">📖 Biblia</a>
      <button type="button" class="btn-header desktop-only" id="btnEditProfileDesktop">👤 Mi Perfil</button>
      <button type="button" class="btn-header btn-logout desktop-only" id="btnLogoutDesktop" title="Cerrar Sesión">🚪 Salir</button>

      <!-- 3. MENÚ AGRUPADO HAMBURGUESA (EN MÓVIL) -->
      <div class="menu-container mobile-only">
        <button type="button" class="btn-header" id="btnToggleMenu" title="Más opciones">
          ☰ Menú
        </button>
        <div class="dropdown-menu" id="dropdownMenu">
          <button type="button" class="dropdown-item" id="btnEditProfileMobile">👤 Mi Perfil</button>
          <a href="confesiones.html" class="dropdown-item">📜 Confesiones</a>
          <a href="biblia.html" target="_blank" rel="noopener noreferrer" class="dropdown-item">📖 Lector Bíblico</a>
          <button type="button" class="dropdown-item danger" id="btnLogoutMobile">🚪 Salir de la Sala</button>
        </div>
      </div>
    </nav>
  </header>

  <!-- Cuerpo del Chat -->
  <div class="chat-layout">
    <!-- Panel Central de Mensajes -->
    <main class="chat-main">
      <div class="messages-container" id="messagesContainer">
        <!-- Los mensajes en tiempo real se cargan aquí -->
      </div>

      <form class="chat-input-bar" id="chatForm">
        <input type="text" id="msgInput" placeholder="Escribe un mensaje bíblico o teológico..." autocomplete="off" required maxlength="1000">
        <button type="submit" class="btn-send">Enviar</button>
      </form>
    </main>

    <!-- Barra Lateral de Usuarios Activos (Desktop) -->
    <aside class="online-sidebar">
      <div class="sidebar-header">
        <span>Usuarios Activos</span>
        <span id="onlineCountDesktop" style="color:var(--accent);">0</span>
      </div>
      <ul class="user-list" id="onlineUserListDesktop">
        <!-- Lista de usuarios presentes -->
      </ul>
    </aside>
  </div>

  <!-- MODAL 1: ACCIONES DE USUARIO (Al hacer clic en cualquier Nick) -->
  <div class="modal-overlay" id="userActionModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title" id="actionModalTitle">Opciones de Usuario</h3>
        <button type="button" class="btn-close-modal" id="btnCloseActionModal">&times;</button>
      </div>
      <div class="modal-body">
        <div class="user-profile-preview">
          <div class="user-preview-avatar" id="targetAvatar">✝️</div>
          <h4 class="user-preview-nick" id="targetNick">Usuario</h4>
          <div class="user-preview-badges">
            <span class="msg-role-tag" id="targetRole">Miembro</span>
            <span class="user-pill" id="targetDoctrine" style="font-size:0.7rem;">Reformado</span>
          </div>
        </div>

        <div class="action-btn-group">
          <!-- Acción Privado -->
          <button type="button" class="btn-action" id="btnStartPrivateChat">
            💬 Enviar Mensaje Privado
          </button>

          <!-- Acciones de Moderador / Admin -->
          <div id="adminActionSection" style="display:none; flex-direction:column; gap:8px; margin-top:6px;">
            <div style="font-size:0.75rem; color:var(--accent-ruby); font-weight:700; text-transform:uppercase;">
              Herramientas de Moderación
            </div>
            <button type="button" class="btn-action action-admin" id="btnMuteUser">
              🔇 Silenciar en la Sala
            </button>
            <button type="button" class="btn-action action-admin" id="btnKickUser">
              👢 Expulsar de la Sala (Kick)
            </button>
            <button type="button" class="btn-action action-admin" id="btnClearUserMsgs">
              🗑️ Borrar Mensajes Recientes
            </button>
            <button type="button" class="btn-action action-admin" id="btnChangeRole" style="display:none;">
              👑 Cambiar Rango / Rol
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL 2: EDITAR PERFIL -->
  <div class="modal-overlay" id="editProfileModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title">Editar Mi Perfil</h3>
        <button type="button" class="btn-close-modal" id="btnCloseProfileModal">&times;</button>
      </div>
      <div class="modal-body">
        <form id="editProfileForm">
          <div style="display:flex; flex-direction:column; gap:12px;">
            <div>
              <label style="font-size:0.8rem; color:var(--text-muted); font-weight:600;">Mi Nick / Alias:</label>
              <input type="text" id="profileInputNick" style="width:100%; padding:9px 12px; border-radius:6px; border:1px solid var(--border-color); background:var(--bg-subpanel); color:var(--text-main); margin-top:4px;" required maxlength="25">
            </div>

            <div>
              <label style="font-size:0.8rem; color:var(--text-muted); font-weight:600;">Trasfondo Doctrinal:</label>
              <select id="profileInputDoctrine" style="width:100%; padding:9px 12px; border-radius:6px; border:1px solid var(--border-color); background:var(--bg-subpanel); color:var(--text-main); margin-top:4px;">
                <option value="Reformada">Reformado(a)</option>
                <option value="Bautista Reformado">Bautista Reformado(a)</option>
                <option value="Presbiteriano">Presbiteriano(a)</option>
                <option value="Bautista General">Bautista General</option>
                <option value="Metodista / Trad. Wesleyana">Metodista / Trad. Wesleyana</option>
                <option value="Pentecostal">Pentecostal</option>
                <option value="Otro trasfondo">Otro trasfondo</option>
              </select>
            </div>

            <div>
              <label style="font-size:0.8rem; color:var(--text-muted); font-weight:600;">Versículo o Cita Lema:</label>
              <input type="text" id="profileInputBio" placeholder="Ej. Romanos 8:28" style="width:100%; padding:9px 12px; border-radius:6px; border:1px solid var(--border-color); background:var(--bg-subpanel); color:var(--text-main); margin-top:4px;" maxlength="100">
            </div>

            <button type="submit" class="btn-send" style="width:100%; margin-top:6px;">Guardar Cambios</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- MODAL 3: MENSAJES PRIVADOS -->
  <div class="modal-overlay" id="privatesModal">
    <div class="modal-card" style="max-width:500px;">
      <div class="modal-header">
        <h3 class="modal-title" id="privateModalTitle">Mensajes Privados</h3>
        <button type="button" class="btn-close-modal" id="btnClosePrivatesModal">&times;</button>
      </div>
      <div class="privates-layout">
        <div class="private-conv-header" id="privatePartnerHeader">
          <span>Conversación con: <strong id="privatePartnerNick">Selecciona un usuario</strong></span>
        </div>
        <div class="private-messages-list" id="privateMessagesList">
          <!-- Mensajes privados -->
        </div>
        <form class="private-input-row" id="privateSendForm">
          <input type="text" id="privateMsgInput" placeholder="Mensaje privado directo..." autocomplete="off" required maxlength="500">
          <button type="submit" class="btn-send" style="padding:8px 14px;">Enviar</button>
        </form>
      </div>
    </div>
  </div>

  <!-- MODAL 4: USUARIOS EN LÍNEA (Móvil) -->
  <div class="modal-overlay" id="onlineMobileModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title">Usuarios en Línea (<span id="onlineCountMobileTitle">0</span>)</h3>
        <button type="button" class="btn-close-modal" id="btnCloseOnlineMobileModal">&times;</button>
      </div>
      <div class="modal-body" style="padding:10px;">
        <ul class="user-list" id="onlineUserListMobile" style="max-height:60vh;">
          <!-- Lista móvil de conectados -->
        </ul>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://axggsuhdurllzisrzpam.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_POBDb2OUFVVFcldLXTNY2Q_lt0xMeax";
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;
    let presenceChannel = null;
    let selectedTargetUser = null; // Para acciones de usuario
    let activePrivatePartner = null; // Para chat privado activo

    // 1. INICIALIZACIÓN DE SESIÓN Y SEGURIDAD
    async function initSession() {
      const guestRaw = localStorage.getItem('guest_user');

      if (guestRaw) {
        try {
          const guest = JSON.parse(guestRaw);

          // Verificar si el nick pertenece a una cuenta registrada
          let isReg = false;
          const { data: isTaken } = await client.rpc('is_nick_registered', { target_nick: guest.username });
          if (isTaken) isReg = true;

          if (isReg) {
            alert(`El alias "${guest.username}" pertenece a una cuenta registrada. Debes iniciar sesión con tu contraseña.`);
            localStorage.removeItem('guest_user');
            window.location.replace('index.html');
            return;
          }

          currentUser = {
            id: 'guest_' + (guest.id_salt || Math.random().toString(36).substring(2, 9)),
            username: guest.username,
            role: 'guest',
            doctrine: guest.doctrine_affinity || 'Reformada',
            bio: guest.bio || ''
          };
        } catch (e) {
          localStorage.removeItem('guest_user');
          window.location.replace('index.html');
          return;
        }
      } else {
        const { data: { session } } = await client.auth.getSession();
        if (!session) {
          window.location.replace('index.html');
          return;
        }

        const { data: profile } = await client
          .from('profiles')
          .select('username, role, doctrine_affinity, bio')
          .eq('id', session.user.id)
          .single();

        currentUser = {
          id: session.user.id,
          username: profile ? profile.username : (session.user.user_metadata.username || 'Hermano'),
          role: profile ? profile.role : 'novice',
          doctrine: profile ? profile.doctrine_affinity : 'Reformada',
          bio: profile ? profile.bio : ''
        };
      }

      updateUserUI();
      setupPresence();
      loadRecentMessages();
      subscribeToMessages();
      setupPrivateMessaging();
    }

    function updateUserUI() {
      document.getElementById('userPillName').textContent = currentUser.username;
      document.getElementById('userPill').title = `${currentUser.username} (${currentUser.role}) - Clic para editar perfil`;
    }

    // 2. CONTROL DE PRESENCIA Y NICK DUPLICADO
    function setupPresence() {
      const myNickLower = currentUser.username.trim().toLowerCase();

      presenceChannel = client.channel('room_presence', {
        config: { presence: { key: myNickLower } }
      });

      presenceChannel
        .on('presence', { event: 'sync' }, () => {
          const state = presenceChannel.presenceState();
          const activeKeys = Object.keys(state);
          const totalOnline = activeKeys.length;

          document.getElementById('onlineCountBadge').textContent = totalOnline;
          document.getElementById('onlineCountDesktop').textContent = totalOnline;
          document.getElementById('onlineCountMobileTitle').textContent = totalOnline;

          // Prevención de duplicados para invitados
          if (currentUser.role === 'guest') {
            const entries = state[myNickLower] || [];
            if (entries.length > 1) {
              const firstJoined = entries[0].user_id;
              if (firstJoined !== currentUser.id) {
                alert(`Ya hay un usuario conectado con el alias "${currentUser.username}". Elige otro nombre.`);
                localStorage.removeItem('guest_user');
                window.location.replace('index.html');
                return;
              }
            }
          }

          renderOnlineUsers(state);
        })
        .subscribe(async (status) => {
          if (status === 'SUBSCRIBED') {
            await presenceChannel.track({
              user_id: currentUser.id,
              username: currentUser.username,
              role: currentUser.role,
              doctrine: currentUser.doctrine,
              online_at: new Date().toISOString()
            });
          }
        });
    }

    function renderOnlineUsers(state) {
      const desktopList = document.getElementById('onlineUserListDesktop');
      const mobileList = document.getElementById('onlineUserListMobile');

      desktopList.innerHTML = '';
      mobileList.innerHTML = '';

      Object.keys(state).forEach(k => {
        const entry = state[k][0];
        const isMe = entry.username.toLowerCase() === currentUser.username.toLowerCase();

        const liDesktop = createOnlineUserElement(entry, isMe);
        const liMobile = createOnlineUserElement(entry, isMe);

        desktopList.appendChild(liDesktop);
        mobileList.appendChild(liMobile);
      });
    }

    function createOnlineUserElement(userData, isMe) {
      const li = document.createElement('li');
      li.className = 'online-user-item';
      li.innerHTML = `
        <span><span class="online-status-dot"></span><strong>${userData.username}</strong> ${isMe ? '<small style="color:var(--text-muted);">(Tú)</small>' : ''}</span>
        <span class="msg-role-tag role-${userData.role}">${userData.role}</span>
      `;
      li.onclick = () => openUserActionModal(userData);
      return li;
    }

    // 3. MENÚ DE ACCIONES DE USUARIO (Al hacer clic en cualquier Nick)
    function openUserActionModal(targetUser) {
      selectedTargetUser = targetUser;

      document.getElementById('targetNick').textContent = targetUser.username;
      document.getElementById('targetRole').textContent = targetUser.role || 'Miembro';
      document.getElementById('targetRole').className = `msg-role-tag role-${targetUser.role || 'novice'}`;
      document.getElementById('targetDoctrine').textContent = targetUser.doctrine || 'Reformada';

      const isMe = targetUser.username.toLowerCase() === currentUser.username.toLowerCase();
      const adminSection = document.getElementById('adminActionSection');
      const btnRole = document.getElementById('btnChangeRole');

      // Si soy yo mismo, abrimos directamente editar perfil
      if (isMe) {
        openEditProfileModal();
        return;
      }

      // Mostrar herramientas de Admin / Moderador
      const isStaff = currentUser.role === 'admin' || currentUser.role === 'moderator';
      adminSection.style.display = isStaff ? 'flex' : 'none';
      btnRole.style.display = currentUser.role === 'admin' ? 'block' : 'none';

      document.getElementById('userActionModal').classList.add('open');
    }

    document.getElementById('btnCloseActionModal').onclick = () => {
      document.getElementById('userActionModal').classList.remove('open');
    };

    // Iniciar Chat Privado desde el Modal de Usuario
    document.getElementById('btnStartPrivateChat').onclick = () => {
      document.getElementById('userActionModal').classList.remove('open');
      if (selectedTargetUser) {
        startPrivateChatWith(selectedTargetUser.username);
      }
    };

    // Acciones de Moderación
    document.getElementById('btnMuteUser').onclick = () => {
      if (!selectedTargetUser) return;
      alert(`Se ha aplicado silencio temporal a ${selectedTargetUser.username} en la sala.`);
      document.getElementById('userActionModal').classList.remove('open');
    };

    document.getElementById('btnKickUser').onclick = () => {
      if (!selectedTargetUser) return;
      if (confirm(`¿Deseas expulsar a ${selectedTargetUser.username} de la sala de chat?`)) {
        alert(`El usuario ${selectedTargetUser.username} ha sido expulsado.`);
        document.getElementById('userActionModal').classList.remove('open');
      }
    };

    document.getElementById('btnClearUserMsgs').onclick = async () => {
      if (!selectedTargetUser) return;
      if (confirm(`¿Eliminar los mensajes visibles de ${selectedTargetUser.username}?`)) {
        document.querySelectorAll('.message-item').forEach(el => {
          const sender = el.querySelector('.msg-sender');
          if (sender && sender.textContent.trim().toLowerCase() === selectedTargetUser.username.toLowerCase()) {
            el.remove();
          }
        });
        document.getElementById('userActionModal').classList.remove('open');
      }
    };

    document.getElementById('btnChangeRole').onclick = () => {
      if (!selectedTargetUser) return;
      const nuevo = prompt(`Cambiar rol de ${selectedTargetUser.username} a (novice, member, moderator, admin):`, selectedTargetUser.role || 'novice');
      if (nuevo) {
        alert(`Rol de ${selectedTargetUser.username} actualizado a ${nuevo}.`);
        document.getElementById('userActionModal').classList.remove('open');
      }
    };

    // 4. MODAL EDITAR PERFIL
    function openEditProfileModal() {
      document.getElementById('profileInputNick').value = currentUser.username;
      document.getElementById('profileInputDoctrine').value = currentUser.doctrine || 'Reformada';
      document.getElementById('profileInputBio').value = currentUser.bio || '';
      document.getElementById('editProfileModal').classList.add('open');
      document.getElementById('dropdownMenu').classList.remove('show');
    }

    document.getElementById('btnEditProfileDesktop').onclick = openEditProfileModal;
    document.getElementById('btnEditProfileMobile').onclick = openEditProfileModal;
    document.getElementById('userPill').onclick = openEditProfileModal;

    document.getElementById('btnCloseProfileModal').onclick = () => {
      document.getElementById('editProfileModal').classList.remove('open');
    };

    document.getElementById('editProfileForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const newNick = document.getElementById('profileInputNick').value.trim();
      const newDoctrine = document.getElementById('profileInputDoctrine').value;
      const newBio = document.getElementById('profileInputBio').value.trim();

      if (!newNick) return;

      // Si el nick cambió y es invitado, verificar que no esté tomado
      if (newNick.toLowerCase() !== currentUser.username.toLowerCase()) {
        const { data: isTaken } = await client.rpc('is_nick_registered', { target_nick: newNick });
        if (isTaken) {
          alert(`El nick "${newNick}" pertenece a una cuenta registrada.`);
          return;
        }
      }

      currentUser.username = newNick;
      currentUser.doctrine = newDoctrine;
      currentUser.bio = newBio;

      if (currentUser.role === 'guest') {
        localStorage.setItem('guest_user', JSON.stringify({
          username: newNick,
          doctrine_affinity: newDoctrine,
          bio: newBio
        }));
      } else {
        await client.from('profiles').update({
          username: newNick,
          doctrine_affinity: newDoctrine,
          bio: newBio
        }).eq('id', currentUser.id);
      }

      updateUserUI();
      document.getElementById('editProfileModal').classList.remove('open');

      // Actualizar presencia
      if (presenceChannel) {
        await presenceChannel.track({
          user_id: currentUser.id,
          username: currentUser.username,
          role: currentUser.role,
          doctrine: currentUser.doctrine
        });
      }
      alert("Perfil actualizado correctamente.");
    });

    // 5. SISTEMA DE PRIVADOS EN TIEMPO REAL (BROADCAST + LOCALSTORAGE)
    const privatesModal = document.getElementById('privatesModal');
    const privateMessagesList = document.getElementById('privateMessagesList');
    let privateBroadcastChannel = null;
    let unreadPrivatesCount = 0;

    document.getElementById('btnOpenPrivates').onclick = () => {
      privatesModal.classList.add('open');
      unreadPrivatesCount = 0;
      document.getElementById('privatesUnreadBadge').style.display = 'none';
      if (!activePrivatePartner) {
        privateMessagesList.innerHTML = '<p style="color:var(--text-muted); text-align:center; margin-top:20px;">Haz clic en el nick de cualquier usuario para iniciar una conversación privada.</p>';
      } else {
        renderPrivateHistory();
      }
    };

    document.getElementById('btnClosePrivatesModal').onclick = () => {
      privatesModal.classList.remove('open');
    };

    function startPrivateChatWith(partnerNick) {
      activePrivatePartner = partnerNick;
      document.getElementById('privatePartnerNick').textContent = partnerNick;
      privatesModal.classList.add('open');
      unreadPrivatesCount = 0;
      document.getElementById('privatesUnreadBadge').style.display = 'none';
      renderPrivateHistory();
    }

    function getPrivateStorageKey(partner) {
      const pair = [currentUser.username.toLowerCase(), partner.toLowerCase()].sort().join('__');
      return `priv_msgs_${pair}`;
    }

    function renderPrivateHistory() {
      if (!activePrivatePartner) return;
      const key = getPrivateStorageKey(activePrivatePartner);
      const raw = localStorage.getItem(key);
      const msgs = raw ? JSON.parse(raw) : [];

      privateMessagesList.innerHTML = '';
      if (msgs.length === 0) {
        privateMessagesList.innerHTML = `<p style="color:var(--text-muted); text-align:center; font-size:0.8rem; margin-top:20px;">Inicio de la conversación con ${escapeHTML(activePrivatePartner)}. Los mensajes se transmiten en directo y se guardan de forma privada en tu navegador.</p>`;
      } else {
        msgs.forEach(m => {
          const isMe = m.sender.toLowerCase() === currentUser.username.toLowerCase();
          const pDiv = document.createElement('div');
          pDiv.className = `message-item ${isMe ? 'self' : 'other'}`;
          pDiv.innerHTML = `
            <div class="msg-header">
              <strong>${escapeHTML(m.sender)}</strong>
              <span class="msg-time">${m.time}</span>
            </div>
            <div class="msg-body">${escapeHTML(m.text)}</div>
          `;
          privateMessagesList.appendChild(pDiv);
        });
      }
      privateMessagesList.scrollTop = privateMessagesList.scrollHeight;
    }

    document.getElementById('privateSendForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('privateMsgInput');
      const text = input.value.trim();
      if (!text || !activePrivatePartner) return;

      input.value = '';
      const key = getPrivateStorageKey(activePrivatePartner);
      const raw = localStorage.getItem(key);
      const msgs = raw ? JSON.parse(raw) : [];

      const newMsg = {
        sender: currentUser.username,
        receiver: activePrivatePartner,
        text: text,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      };

      // 1. Guardar en el historial local del emisor
      msgs.push(newMsg);
      localStorage.setItem(key, JSON.stringify(msgs));
      renderPrivateHistory();

      // 2. Transmitir en tiempo real al destinatario vía Broadcast de Supabase
      if (privateBroadcastChannel) {
        await privateBroadcastChannel.send({
          type: 'broadcast',
          event: 'direct_message',
          payload: newMsg
        });
      }
    });

    function setupPrivateMessaging() {
      // Canal global de mensajería privada directa en tiempo real
      privateBroadcastChannel = client.channel('direct_messages_broadcast');

      privateBroadcastChannel
        .on('broadcast', { event: 'direct_message' }, ({ payload }) => {
          if (!payload || !payload.receiver || !payload.sender) return;

          // Verificar si el mensaje está dirigido a este usuario
          const myNick = currentUser.username.trim().toLowerCase();
          const targetNick = payload.receiver.trim().toLowerCase();

          if (targetNick === myNick) {
            // Guardar en el historial local del receptor
            const key = getPrivateStorageKey(payload.sender);
            const raw = localStorage.getItem(key);
            const msgs = raw ? JSON.parse(raw) : [];
            msgs.push(payload);
            localStorage.setItem(key, JSON.stringify(msgs));

            // Si el modal está abierto y conversando con ese usuario, renderizarlo al instante
            const isModalOpen = privatesModal.classList.contains('open');
            if (isModalOpen && activePrivatePartner && activePrivatePartner.toLowerCase() === payload.sender.toLowerCase()) {
              renderPrivateHistory();
            } else {
              // Notificar con el contador en el botón de Privados
              unreadPrivatesCount++;
              const badge = document.getElementById('privatesUnreadBadge');
              badge.textContent = unreadPrivatesCount;
              badge.style.display = 'inline-block';
            }
          }
        })
        .subscribe();
    }
// 6. MODAL USUARIOS EN LÍNEA EN MÓVIL
    document.getElementById('btnShowOnline').onclick = () => {
      if (window.innerWidth <= 768) {
        document.getElementById('onlineMobileModal').classList.add('open');
      } else {
        document.getElementById('onlineUserListDesktop').scrollIntoView({ behavior: 'smooth' });
      }
    };
    document.getElementById('btnCloseOnlineMobileModal').onclick = () => {
      document.getElementById('onlineMobileModal').classList.remove('open');
    };

    // 7. MENÚ MÓVIL HAMBURGUESA
    const btnToggleMenu = document.getElementById('btnToggleMenu');
    const dropdownMenu = document.getElementById('dropdownMenu');
    if (btnToggleMenu) {
      btnToggleMenu.onclick = (e) => {
        e.stopPropagation();
        dropdownMenu.classList.toggle('show');
      };
    }
    document.addEventListener('click', () => {
      if (dropdownMenu) dropdownMenu.classList.remove('show');
    });

    // 8. CARGA Y ENVÍO DE MENSAJES PÚBLICOS
    const messagesContainer = document.getElementById('messagesContainer');

    function appendMessage(msg) {
      const isSelf = msg.username.toLowerCase() === currentUser.username.toLowerCase();
      const div = document.createElement('div');
      div.className = `message-item ${isSelf ? 'self' : 'other'}`;

      const timeStr = new Date(msg.created_at || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const role = msg.role || 'novice';

      div.innerHTML = `
        <div class="msg-header">
          <span class="msg-sender" data-nick="${escapeHTML(msg.username)}" data-role="${role}">${escapeHTML(msg.username)}</span>
          <span class="msg-role-tag role-${role}">${role}</span>
          <span class="msg-time">${timeStr}</span>
        </div>
        <div class="msg-body">${escapeHTML(msg.content)}</div>
      `;

      // Clic en el nick dentro del mensaje
      div.querySelector('.msg-sender').onclick = () => {
        openUserActionModal({
          username: msg.username,
          role: role,
          doctrine: msg.doctrine || 'Reformada'
        });
      };

      messagesContainer.appendChild(div);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    async function loadRecentMessages() {
      const { data: messages } = await client
        .from('messages')
        .select('*')
        .order('created_at', { ascending: true })
        .limit(60);

      if (messages) {
        messagesContainer.innerHTML = '';
        messages.forEach(m => appendMessage(m));
      }
    }

    function subscribeToMessages() {
      client
        .channel('public_chat_messages')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, (payload) => {
          appendMessage(payload.new);
        })
        .subscribe();
    }

    document.getElementById('chatForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('msgInput');
      const text = input.value.trim();
      if (!text) return;

      input.value = '';

      const newMsg = {
        sender_id: currentUser.id,
        username: currentUser.username,
        role: currentUser.role,
        content: text,
        created_at: new Date().toISOString()
      };

      const { error } = await client.from('messages').insert([newMsg]);
      if (error) {
        appendMessage(newMsg);
      }
    });

    // 9. CERRAR SESIÓN
    async function logout() {
      if (confirm('¿Deseas salir de la sala de chat?')) {
        if (presenceChannel) await presenceChannel.untrack();
        localStorage.removeItem('guest_user');
        await client.auth.signOut();
        window.location.replace('index.html');
      }
    }
    document.getElementById('btnLogoutDesktop').onclick = logout;
    document.getElementById('btnLogoutMobile').onclick = logout;

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    // Inicializar
    initSession();
  </script>
</body>
</html>
