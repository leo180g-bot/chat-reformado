<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Comunión Doctrinal - Lector Bíblico</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-body: #0f172a;
      --bg-panel: #1e293b;
      --bg-surface: #111827;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-btn: #0284c7;
      --accent-btn-hover: #0369a1;
      --verse-num: #facc15;
      --copy-highlight: rgba(56, 189, 248, 0.15);
      --font-family: 'Georgia', serif;
      --font-size: 1.15rem;
      --line-height: 1.8;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg-body);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      width: 100%;
      overflow-x: hidden;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border-color);
      padding: 10px 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      width: 100%;
    }

    .nav-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-icon-control {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 7px 11px;
      border-radius: 6px;
      font-size: 0.95rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, border-color 0.15s;
    }
    .btn-icon-control:hover, .btn-icon-control.active {
      background: var(--border-color);
      border-color: var(--accent);
      color: var(--accent);
    }

    select {
      background: var(--bg-surface);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 0.88rem;
      outline: none;
      cursor: pointer;
    }
    select:focus { border-color: var(--accent); }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      position: relative;
    }

    /* Menú desplegable contextual */
    .dropdown-popover {
      display: none;
      position: absolute;
      top: 44px;
      right: 0;
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.65);
      z-index: 100;
      min-width: 190px;
      flex-direction: column;
      overflow: hidden;
    }
    .dropdown-popover.open { display: flex; }

    .dropdown-link {
      padding: 10px 14px;
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.88rem;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.15s;
    }
    .dropdown-link:hover {
      background: var(--bg-surface);
      color: var(--accent);
    }

    /* Popover para fuentes */
    .font-settings-popover {
      display: none;
      position: absolute;
      top: 44px;
      right: 0;
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.65);
      z-index: 100;
      flex-direction: column;
      gap: 8px;
      min-width: 190px;
    }
    .font-settings-popover.open { display: flex; }

    .font-popover-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .font-popover-row select {
      width: 100%;
      font-size: 0.82rem;
    }
    .btn-font-size {
      flex: 1;
      padding: 6px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.82rem;
      text-align: center;
    }
    .btn-font-size:hover {
      background: var(--border-color);
      color: var(--accent);
    }

    main.reader-container {
      flex: 1;
      width: 100%;
      max-width: 100%;
      margin: 0;
      padding: 24px 24px 60px 24px;
    }

    .chapter-heading-area {
      text-align: center;
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
      width: 100%;
    }
    .chapter-heading-area h1 {
      font-size: 2rem;
      color: var(--accent);
      font-family: var(--font-family);
      margin-bottom: 6px;
    }
    .chapter-heading-area .version-sub {
      font-size: 0.85rem;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-weight: 600;
    }

    .chapter-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-bottom: 20px;
      width: 100%;
    }
    .btn-action {
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }
    .btn-action:hover {
      color: var(--text-main);
      border-color: var(--accent);
      background: var(--bg-surface);
    }

    .bible-text-flow {
      width: 100%;
      font-family: var(--font-family);
      font-size: var(--font-size);
      line-height: var(--line-height);
      color: var(--text-main);
      text-align: justify;
    }

    .section-title {
      font-size: 1.25em;
      font-weight: 700;
      color: var(--accent);
      margin: 26px 0 12px;
      font-family: system-ui, sans-serif;
      text-align: left;
    }

    .verse-inline {
      display: inline;
      cursor: pointer;
      border-radius: 4px;
      padding: 0 3px;
      transition: background 0.15s;
    }
    .verse-inline:hover {
      background: rgba(56, 189, 248, 0.15);
    }
    .verse-inline.copied {
      background: var(--copy-highlight);
    }
    .v-num {
      font-size: 0.74em;
      font-weight: bold;
      color: var(--verse-num);
      vertical-align: super;
      margin-right: 4px;
      user-select: none;
    }

    .bottom-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid var(--border-color);
      width: 100%;
    }
    .btn-nav-page {
      background: var(--accent-btn);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s;
    }
    .btn-nav-page:hover { background: var(--accent-btn-hover); }
    .btn-nav-page:disabled {
      background: var(--bg-surface);
      color: var(--text-muted);
      cursor: not-allowed;
      border: 1px solid var(--border-color);
    }

    /* Modal de Búsqueda */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      align-items: center;
      justify-content: center;
      z-index: 120;
      padding: 16px;
    }
    .modal-overlay.open { display: flex; }

    .modal-card {
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      max-width: 650px;
      width: 100%;
      height: 85vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-color);
    }
    .modal-header h2 {
      font-size: 1.1rem;
      color: var(--accent);
      margin: 0;
    }
    .close-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.3rem;
      cursor: pointer;
    }

    .search-input-area {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      gap: 8px;
      background: var(--bg-surface);
    }
    .search-input-area input {
      flex: 1;
      padding: 9px 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: var(--bg-body);
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
    }
    .search-input-area input:focus { border-color: var(--accent); }
    .btn-search-exec {
      background: var(--accent-btn);
      color: white;
      border: none;
      padding: 9px 16px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .btn-search-exec:hover { background: var(--accent-btn-hover); }

    .search-results-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .search-result-item {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 10px 14px;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: left;
    }
    .search-result-item:hover {
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.08);
    }
    .result-ref {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 4px;
    }
    .result-text {
      font-size: 0.92rem;
      color: var(--text-main);
      line-height: 1.45;
    }
    .result-highlight {
      background: #ca8a04;
      color: #000;
      padding: 1px 3px;
      border-radius: 3px;
      font-weight: 700;
    }

    .toast-msg {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #0284c7;
      color: #fff;
      padding: 8px 18px;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
      opacity: 0;
      transition: all 0.25s ease;
      z-index: 130;
    }
    .toast-msg.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @media (max-width: 768px) {
      header { padding: 8px 12px; gap: 8px; }
      .nav-controls { width: 100%; justify-content: space-between; }
      .nav-controls select { flex: 1; min-width: 0; }
      main.reader-container { padding: 16px 12px 50px 12px; }
      .bible-text-flow { text-align: left; }
      .chapter-heading-area h1 { font-size: 1.6rem; }
    }
  </style>
</head>
<body>

  <header>
    <div class="nav-controls">
      <select id="versionSelect" title="Seleccionar versión">
        <option value="RVR1960">RVR1960</option>
        <option value="RVSBT18">RVSBT18</option>
      </select>

      <select id="bookSelect" title="Seleccionar libro"></select>
      <select id="chapterSelect" title="Seleccionar capítulo"></select>
    </div>

    <div class="header-actions">
      <!-- Botón de Búsqueda -->
      <button type="button" class="btn-icon-control" id="btnOpenSearch" title="Buscar versículos">🔍</button>

      <!-- Botón de Configuración de Fuentes -->
      <button type="button" class="btn-icon-control" id="btnFontToggle" title="Ajustes de fuente y tamaño">Aa</button>

      <!-- Popover de Fuentes -->
      <div class="font-settings-popover" id="fontPopover">
        <div class="font-popover-row">
          <select id="fontSelect" title="Fuente tipográfica">
            <option value="'Georgia', serif" selected>Serif (Georgia)</option>
            <option value="system-ui, -apple-system, sans-serif">Sans (Moderna)</option>
            <option value="'Courier New', monospace">Mono (Espaciada)</option>
          </select>
        </div>
        <div class="font-popover-row">
          <button type="button" class="btn-font-size" id="btnFontDec" title="Reducir tamaño">A -</button>
          <button type="button" class="btn-font-size" id="btnFontInc" title="Aumentar tamaño">A +</button>
        </div>
      </div>

      <!-- Menú Desplegable con Enlace a Inicio y Chat -->
      <button type="button" class="btn-icon-control" id="btnNavMenu" title="Menú de navegación">☰</button>

      <div class="dropdown-popover" id="navDropdown">
        <a href="index.html" class="dropdown-link">🏠 Inicio</a>
        <a href="chat.html" target="_blank" rel="noopener noreferrer" class="dropdown-link">💬 Chat (Nueva pestaña) ↗</a>
      </div>
    </div>
  </header>

  <main class="reader-container">
    <div class="chapter-heading-area">
      <h1 id="chapterTitle">Cargando...</h1>
      <span class="version-sub" id="versionLabel">Reina-Valera 1960 (RVR1960)</span>
    </div>

    <div class="chapter-actions">
      <button type="button" class="btn-action" id="btnCopyChapter" title="Copiar todo el capítulo con formato de cita">
        📋 Copiar capítulo completo
      </button>
    </div>

    <article class="bible-text-flow" id="bibleContent"></article>

    <div class="bottom-nav">
      <button type="button" class="btn-nav-page" id="btnPrevChapter">← Anterior</button>
      <button type="button" class="btn-nav-page" id="btnNextChapter">Siguiente →</button>
    </div>
  </main>

  <!-- Modal Buscador por Palabras -->
  <div class="modal-overlay" id="searchModal">
    <div class="modal-card">
      <div class="modal-header">
        <h2>Buscador Bíblico (<span id="searchVersionTag">RVR1960</span>)</h2>
        <button class="close-btn" id="btnCloseSearch">&times;</button>
      </div>

      <div class="search-input-area">
        <input type="text" id="searchInput" placeholder="Escribe una palabra o frase (ej. gracia, fe, justificación)..." autocomplete="off">
        <button type="button" class="btn-search-exec" id="btnExecSearch">Buscar</button>
      </div>

      <div style="padding: 6px 16px; font-size: 0.78rem; color: var(--text-muted); background: var(--bg-panel);" id="searchStatusInfo">
        Escribe un término y presiona Enter o Buscar.
      </div>

      <div class="search-results-list" id="searchResultsList"></div>
    </div>
  </div>

  <div class="toast-msg" id="toast">Texto copiado al portapapeles</div>

  <script>
    const BIBLE_VERSIONS = {
      "RVR1960": {
        name: "Reina-Valera 1960 (RVR1960)",
        tag: "RVR1960",
        file: "./RVR1960.json"
      },
      "RVSBT18": {
        name: "Reina Valera SBT 2018 (RVSBT18)",
        tag: "RVSBT18",
        file: "./RVSBT18.json"
      }
    };

    const biblesCache = {};

    let currentVersionKey = localStorage.getItem('bible_version') || 'RVR1960';

    let currentBookIndex = parseInt(localStorage.getItem('bible_last_book'), 10);
    if (isNaN(currentBookIndex)) currentBookIndex = 42; // Juan

    let currentChapterNum = parseInt(localStorage.getItem('bible_last_chapter'), 10);
    if (isNaN(currentChapterNum)) currentChapterNum = 1;

    const versionSelect = document.getElementById('versionSelect');
    const bookSelect = document.getElementById('bookSelect');
    const chapterSelect = document.getElementById('chapterSelect');
    const chapterTitle = document.getElementById('chapterTitle');
    const versionLabel = document.getElementById('versionLabel');
    const bibleContent = document.getElementById('bibleContent');
    const btnPrevChapter = document.getElementById('btnPrevChapter');
    const btnNextChapter = document.getElementById('btnNextChapter');
    const btnCopyChapter = document.getElementById('btnCopyChapter');
    const toast = document.getElementById('toast');

    versionSelect.value = currentVersionKey;

    // Configuración visual y ampliación de escala tipográfica
    const fontSelect = document.getElementById('fontSelect');
    let currentFontSizeRem = parseFloat(localStorage.getItem('bible_font_size')) || 1.15;
    let currentFontFamily = localStorage.getItem('bible_font_family') || "'Georgia', serif";

    function applyReaderStyles() {
      document.documentElement.style.setProperty('--font-size', `${currentFontSizeRem}rem`);
      document.documentElement.style.setProperty('--font-family', currentFontFamily);
      fontSelect.value = currentFontFamily;
    }
    applyReaderStyles();

    fontSelect.onchange = (e) => {
      currentFontFamily = e.target.value;
      localStorage.setItem('bible_font_family', currentFontFamily);
      applyReaderStyles();
    };

    // Aumento hasta 2.5rem (más de 2 veces el tamaño original de 1.15rem)
    document.getElementById('btnFontInc').onclick = () => {
      if (currentFontSizeRem < 2.5) {
        currentFontSizeRem = Math.round((currentFontSizeRem + 0.1) * 100) / 100;
        localStorage.setItem('bible_font_size', currentFontSizeRem);
        applyReaderStyles();
      }
    };

    document.getElementById('btnFontDec').onclick = () => {
      if (currentFontSizeRem > 0.85) {
        currentFontSizeRem = Math.round((currentFontSizeRem - 0.1) * 100) / 100;
        localStorage.setItem('bible_font_size', currentFontSizeRem);
        applyReaderStyles();
      }
    };

    // Menús desplegables
    const btnNavMenu = document.getElementById('btnNavMenu');
    const navDropdown = document.getElementById('navDropdown');
    const btnFontToggle = document.getElementById('btnFontToggle');
    const fontPopover = document.getElementById('fontPopover');

    btnNavMenu.onclick = (e) => {
      e.stopPropagation();
      fontPopover.classList.remove('open');
      btnFontToggle.classList.remove('active');
      navDropdown.classList.toggle('open');
      btnNavMenu.classList.toggle('active');
    };

    btnFontToggle.onclick = (e) => {
      e.stopPropagation();
      navDropdown.classList.remove('open');
      btnNavMenu.classList.remove('active');
      fontPopover.classList.toggle('open');
      btnFontToggle.classList.toggle('active');
    };

    document.addEventListener('click', (e) => {
      if (!navDropdown.contains(e.target) && e.target !== btnNavMenu) {
        navDropdown.classList.remove('open');
        btnNavMenu.classList.remove('active');
      }
      if (!fontPopover.contains(e.target) && e.target !== btnFontToggle) {
        fontPopover.classList.remove('open');
        btnFontToggle.classList.remove('active');
      }
    });

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2200);
    }

    async function loadVersionData(versionKey) {
      if (biblesCache[versionKey]) return biblesCache[versionKey];

      const config = BIBLE_VERSIONS[versionKey];
      chapterTitle.textContent = "Cargando texto bíblico...";
      versionLabel.textContent = config.name;

      try {
        const res = await fetch(config.file);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        biblesCache[versionKey] = data;
        return data;
      } catch (err) {
        chapterTitle.textContent = "Error al cargar la Biblia";
        bibleContent.innerHTML = `<p style="color: #fca5a5; text-align: center;">No se pudo leer <code>${config.file}</code>. Asegúrate de tenerlo en la raíz del repositorio.</p>`;
        throw err;
      }
    }

    async function switchVersion(versionKey) {
      currentVersionKey = versionKey;
      localStorage.setItem('bible_version', versionKey);
      document.getElementById('searchVersionTag').textContent = BIBLE_VERSIONS[versionKey].tag;

      try {
        await loadVersionData(versionKey);
        populateBookSelect();

        if (currentBookIndex >= biblesCache[currentVersionKey].books.length) {
          currentBookIndex = 0;
        }

        bookSelect.selectedIndex = currentBookIndex;
        updateChapterSelect();
        renderCurrentChapter();
      } catch (e) {
        console.error(e);
      }
    }

    versionSelect.onchange = (e) => {
      switchVersion(e.target.value);
    };

    function populateBookSelect() {
      const activeBible = biblesCache[currentVersionKey];
      if (!activeBible || !Array.isArray(activeBible.books)) return;

      bookSelect.innerHTML = '';
      activeBible.books.forEach((b, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.textContent = b.human;
        bookSelect.appendChild(opt);
      });
    }

    function updateChapterSelect() {
      const activeBible = biblesCache[currentVersionKey];
      if (!activeBible) return;

      const bookObj = activeBible.books[currentBookIndex];
      chapterSelect.innerHTML = '';
      const totalChapters = bookObj.chapters.length;

      if (currentChapterNum > totalChapters) {
        currentChapterNum = 1;
      }

      for (let i = 1; i <= totalChapters; i++) {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = `Capítulo ${i}`;
        chapterSelect.appendChild(opt);
      }
      chapterSelect.value = currentChapterNum;
    }

    function renderCurrentChapter() {
      const activeBible = biblesCache[currentVersionKey];
      if (!activeBible) return;

      localStorage.setItem('bible_last_book', currentBookIndex);
      localStorage.setItem('bible_last_chapter', currentChapterNum);

      const currentConfig = BIBLE_VERSIONS[currentVersionKey];
      const bookObj = activeBible.books[currentBookIndex];
      const chapterObj = bookObj.chapters[currentChapterNum - 1];

      chapterTitle.textContent = `${bookObj.human} ${currentChapterNum}`;
      versionLabel.textContent = currentConfig.name;
      bibleContent.innerHTML = '';

      if (!chapterObj || !Array.isArray(chapterObj.items)) {
        bibleContent.innerHTML = `<p style="color: var(--text-muted);">Capítulo no disponible.</p>`;
        return;
      }

      chapterObj.items.forEach(item => {
        if (item.type === 'heading1' && Array.isArray(item.lines)) {
          const h = document.createElement('h2');
          h.className = 'section-title';
          h.textContent = item.lines.join(' ');
          bibleContent.appendChild(h);
        } else if (item.type === 'verse' && Array.isArray(item.verse_numbers)) {
          const vNum = item.verse_numbers[0];
          const textRaw = Array.isArray(item.lines) ? item.lines.join(' ').trim() : '';

          const span = document.createElement('span');
          span.className = 'verse-inline';
          span.id = `verse-${vNum}`;
          span.dataset.verseNum = vNum;
          span.dataset.text = textRaw.replace(/<[^>]*>/g, '');
          span.title = "Haz clic para copiar este versículo";

          span.innerHTML = `<span class="v-num">${vNum}</span>${cleanHtmlPreserveItalics(textRaw)} `;

          span.onclick = () => {
            const cleanText = span.dataset.text;
            const citation = `«${cleanText}» (${bookObj.human} ${currentChapterNum}:${vNum} - ${currentConfig.tag})`;
            navigator.clipboard.writeText(citation).then(() => {
              span.classList.add('copied');
              setTimeout(() => span.classList.remove('copied'), 600);
              showToast(`Copiado ${bookObj.human} ${currentChapterNum}:${vNum}`);
            });
          };

          bibleContent.appendChild(span);
        }
      });

      btnPrevChapter.disabled = (currentBookIndex === 0 && currentChapterNum === 1);
      btnNextChapter.disabled = (currentBookIndex === activeBible.books.length - 1 && currentChapterNum === bookObj.chapters.length);

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    btnCopyChapter.onclick = () => {
      const activeBible = biblesCache[currentVersionKey];
      if (!activeBible) return;

      const currentConfig = BIBLE_VERSIONS[currentVersionKey];
      const bookObj = activeBible.books[currentBookIndex];
      const chapterObj = bookObj.chapters[currentChapterNum - 1];

      let versesText = [];
      chapterObj.items.forEach(item => {
        if (item.type === 'verse' && Array.isArray(item.verse_numbers)) {
          const vNum = item.verse_numbers[0];
          const text = Array.isArray(item.lines) ? item.lines.join(' ').trim().replace(/<[^>]*>/g, '') : '';
          versesText.push(`${vNum} ${text}`);
        }
      });

      const fullCitation = `«${versesText.join(' ')}» (${bookObj.human} ${currentChapterNum} - ${currentConfig.tag})`;
      navigator.clipboard.writeText(fullCitation).then(() => {
        showToast(`Capítulo ${bookObj.human} ${currentChapterNum} copiado`);
      });
    };

    bookSelect.onchange = () => {
      currentBookIndex = parseInt(bookSelect.value, 10);
      currentChapterNum = 1;
      updateChapterSelect();
      renderCurrentChapter();
    };

    chapterSelect.onchange = () => {
      currentChapterNum = parseInt(chapterSelect.value, 10);
      renderCurrentChapter();
    };

    btnPrevChapter.onclick = () => {
      const activeBible = biblesCache[currentVersionKey];
      if (currentChapterNum > 1) {
        currentChapterNum--;
      } else if (currentBookIndex > 0) {
        currentBookIndex--;
        bookSelect.selectedIndex = currentBookIndex;
        updateChapterSelect();
        currentChapterNum = activeBible.books[currentBookIndex].chapters.length;
      }
      chapterSelect.value = currentChapterNum;
      renderCurrentChapter();
    };

    btnNextChapter.onclick = () => {
      const activeBible = biblesCache[currentVersionKey];
      const currentBookTotalChaps = activeBible.books[currentBookIndex].chapters.length;
      if (currentChapterNum < currentBookTotalChaps) {
        currentChapterNum++;
      } else if (currentBookIndex < activeBible.books.length - 1) {
        currentBookIndex++;
        bookSelect.selectedIndex = currentBookIndex;
        updateChapterSelect();
        currentChapterNum = 1;
      }
      chapterSelect.value = currentChapterNum;
      renderCurrentChapter();
    };

    // --- Motor de Búsqueda ---
    const searchModal = document.getElementById('searchModal');
    const btnOpenSearch = document.getElementById('btnOpenSearch');
    const btnCloseSearch = document.getElementById('btnCloseSearch');
    const searchInput = document.getElementById('searchInput');
    const btnExecSearch = document.getElementById('btnExecSearch');
    const searchResultsList = document.getElementById('searchResultsList');
    const searchStatusInfo = document.getElementById('searchStatusInfo');

    btnOpenSearch.onclick = () => {
      searchModal.classList.add('open');
      searchInput.focus();
    };
    btnCloseSearch.onclick = () => searchModal.classList.remove('open');

    function stripAccents(str) {
      return (str || '').normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
    }

    function executeBibleSearch() {
      const query = searchInput.value.trim();
      if (!query || query.length < 3) {
        return alert("Por favor escribe al menos 3 letras para buscar.");
      }

      const activeBible = biblesCache[currentVersionKey];
      if (!activeBible || !Array.isArray(activeBible.books)) {
        return alert("El texto bíblico aún se está cargando. Espera un momento.");
      }

      const queryNormalized = stripAccents(query);
      searchResultsList.innerHTML = '';
      searchStatusInfo.textContent = "Buscando coincidencias...";

      let matches = [];
      const MAX_MATCHES = 150;

      for (let bIdx = 0; bIdx < activeBible.books.length; bIdx++) {
        const book = activeBible.books[bIdx];
        for (let cIdx = 0; cIdx < book.chapters.length; cIdx++) {
          const chap = book.chapters[cIdx];
          const chapNum = cIdx + 1;

          if (Array.isArray(chap.items)) {
            for (let i = 0; i < chap.items.length; i++) {
              const item = chap.items[i];
              if (item.type === 'verse' && Array.isArray(item.lines)) {
                const rawText = item.lines.join(' ').replace(/<[^>]*>/g, '');
                const normText = stripAccents(rawText);

                if (normText.includes(queryNormalized)) {
                  matches.push({
                    bookIndex: bIdx,
                    bookName: book.human,
                    chapterNum: chapNum,
                    verseNum: item.verse_numbers[0],
                    text: rawText
                  });

                  if (matches.length >= MAX_MATCHES) break;
                }
              }
            }
          }
          if (matches.length >= MAX_MATCHES) break;
        }
        if (matches.length >= MAX_MATCHES) break;
      }

      renderSearchResults(matches, query);
    }

    function renderSearchResults(matches, term) {
      searchResultsList.innerHTML = '';

      if (matches.length === 0) {
        searchStatusInfo.textContent = `No se hallaron resultados para "${term}".`;
        return;
      }

      searchStatusInfo.textContent = `Se encontraron ${matches.length} concordancias (máx. 150):`;

      const regex = new RegExp(`(${escapeRegExp(term)})`, 'gi');

      matches.forEach(m => {
        const div = document.createElement('div');
        div.className = 'search-result-item';

        const highlightedText = escapeHtml(m.text).replace(regex, '<span class="result-highlight">$1</span>');

        div.innerHTML = `
          <div class="result-ref">${m.bookName} ${m.chapterNum}:${m.verseNum}</div>
          <div class="result-text">${highlightedText}</div>
        `;

        div.onclick = () => {
          searchModal.classList.remove('open');
          navigateToPassage(m.bookIndex, m.chapterNum, m.verseNum);
        };

        searchResultsList.appendChild(div);
      });
    }

    function navigateToPassage(bIndex, cNum, vNum) {
      currentBookIndex = bIndex;
      currentChapterNum = cNum;

      bookSelect.selectedIndex = currentBookIndex;
      updateChapterSelect();
      chapterSelect.value = currentChapterNum;
      renderCurrentChapter();

      setTimeout(() => {
        const targetEl = document.getElementById(`verse-${vNum}`);
        if (targetEl) {
          targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
          targetEl.classList.add('copied');
          setTimeout(() => targetEl.classList.remove('copied'), 2000);
        }
      }, 250);
    }

    btnExecSearch.onclick = executeBibleSearch;
    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') executeBibleSearch();
    });

    function cleanHtmlPreserveItalics(str) {
      if (!str) return '';
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;')
        .replace(/&lt;i&gt;/g, '<i>')
        .replace(/&lt;\/i&gt;/g, '</i>');
    }

    function escapeHtml(str) {
      return (str || '').replace(/[&<>'"]/g, t => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[t] || t));
    }

    function escapeRegExp(string) {
      return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    switchVersion(currentVersionKey);
  </script>
</body>
</html>
